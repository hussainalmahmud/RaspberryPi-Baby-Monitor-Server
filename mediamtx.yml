logLevel: info
logDestinations: [stdout]
readTimeout: 30s
writeTimeout: 30s

api: true
apiAddress: 127.0.0.1:9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: [wlan0]
webrtcAdditionalHosts: []
webrtcICEServers2: []

paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraFPS: 20
    rpiCameraBitrate: 1500000
    rpiCameraIDRPeriod: 20
    # Pi 5 has no H.264 hardware encoder; softwareH264 still produces Safari-friendly H.264.
    rpiCameraCodec: softwareH264
    rpiCameraH264Profile: baseline
    rpiCameraH264Level: "4.1"
    rpiCameraAWB: auto
    rpiCameraExposure: normal
    rpiCameraDenoise: "off"
    rpiCameraGain: 0
    rpiCameraEV: 1
    runOnOnline: /home/hussain/Documents/github/RaspberryPi-Baby-Monitor-Server/scripts/publish_baby_stream.sh
    runOnOnlineRestart: true

  baby:
