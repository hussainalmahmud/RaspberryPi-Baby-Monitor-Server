logLevel: info
logDestinations: [stdout]

api: true
apiAddress: 127.0.0.1:9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: [wlan0]
webrtcAdditionalHosts: []
webrtcICEServers2: []

paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraFPS: 20
    rpiCameraBitrate: 1500000
    rpiCameraIDRPeriod: 20
    # Pi 5 has no H.264 hardware encoder; softwareH264 still produces Safari-friendly H.264.
    rpiCameraCodec: softwareH264
    rpiCameraH264Profile: baseline
    rpiCameraH264Level: "4.1"
    rpiCameraAWB: auto
    rpiCameraExposure: normal
    rpiCameraDenoise: "off"
    rpiCameraGain: 0
    rpiCameraEV: 1
    runOnOnline: >-
      ffmpeg -hide_banner -loglevel warning
      -fflags nobuffer -flags low_delay -probesize 32 -analyzeduration 0
      -rtsp_transport tcp -i rtsp://127.0.0.1:$RTSP_PORT/cam
      -f alsa -thread_queue_size 1024 -ar 48000 -ac 2
      -i plughw:CARD=Device,DEV=0
      -map 0:v:0 -map 1:a:0
      -c:v copy
      -af pan=mono|c0=c0,aresample=async=1:first_pts=0
      -c:a libopus -application lowdelay -b:a 24k -ac 1 -ar 48000
      -muxdelay 0 -muxpreload 0
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/baby
    runOnOnlineRestart: true

  baby:
