<html>
    <head>
        <link rel="manifest" href="/static/manifest.json">
        <link rel="apple-touch-icon" href="/static/imgs/icon.png">
        <link rel="icon" href="/static/imgs/icon.png" type="image/png">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <title>アリー君カメラ</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background: url('/static/imgs/background.jpg') no-repeat center center fixed;
                background-size: cover;
                font-family: Arial, sans-serif;
                color: #fff;
            }
            h1 {
                margin: 20px 0;
                font-size: 36px;
                text-align: center;
                color: #fff;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            }
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                min-height: 100vh;
                padding-top: 20px;
            }
            .video-wrap {
                position: relative;
                width: 100%;
                max-width: 100%;
            }
            video {
                display: block;
                width: 100%;
                height: auto;
                max-width: 100%;
                background: #000;
            }
            .status {
                margin: 12px 0 0;
                font-size: 16px;
                text-align: center;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
            }
            .tap-hint {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(0, 0, 0, 0.35);
                font-size: 22px;
                text-align: center;
                padding: 20px;
            }
            .tap-hint.hidden {
                display: none;
            }
        </style>
        <script defer src="/static/reader.js"></script>
    </head>
    <body>
        <div class="container">
            <h1>アリー君カメラ</h1>
            <div class="video-wrap">
                <video id="live" autoplay playsinline webkit-playsinline muted></video>
                <div id="tap-hint" class="tap-hint">画面をタップして音声をオン</div>
            </div>
            <p id="status" class="status">接続中...</p>
        </div>
        <script>
            const liveVideo = document.getElementById("live");
            const statusLabel = document.getElementById("status");
            const tapHint = document.getElementById("tap-hint");
            const playbackStream = new MediaStream();
            let streamReader = null;

            function setStatus(message) {
                statusLabel.textContent = message;
            }

            function attachTrack(track) {
                if (track.kind === "audio") {
                    playbackStream.getAudioTracks().forEach(function (audioTrack) {
                        playbackStream.removeTrack(audioTrack);
                        audioTrack.stop();
                    });
                }
                const alreadyAttached = playbackStream.getTracks().some(function (existingTrack) {
                    return existingTrack.id === track.id;
                });
                if (!alreadyAttached) {
                    playbackStream.addTrack(track);
                }
                liveVideo.srcObject = playbackStream;
            }

            function startReader() {
                streamReader = new MediaMTXWebRTCReader({
                    url: new URL("/live/whep", window.location.href).toString(),
                    onError: function (errorMessage) {
                        setStatus(errorMessage);
                    },
                    onTrack: function (event) {
                        attachTrack(event.track);
                        setStatus("ライブ");
                        liveVideo.play().catch(function () {});
                    }
                });
            }

            window.addEventListener("load", startReader);
            window.addEventListener("beforeunload", function () {
                if (streamReader !== null) {
                    streamReader.close();
                }
            });

            document.body.addEventListener("click", function () {
                liveVideo.muted = false;
                tapHint.classList.add("hidden");
                liveVideo.play().catch(function (error) {
                    console.error("Play error:", error);
                });
            }, { once: true });
        </script>
    </body>
</html>
